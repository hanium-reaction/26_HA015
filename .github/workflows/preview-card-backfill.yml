name: Preview card target_date backfill (EC2, read-only)

# #229 사전 실측 — #223 이전에 승인된 계획의 카드가 몇 건이고, 백필하면 **몇 명이 오늘 탭을
# 되찾는지**를 라이브 RDS 에서 읽기 전용으로 센다.
# deploy.yml 과 같은 self-hosted EC2 runner 에서 돌아 prod .env(RDS DATABASE_URL)를 쓴다.
#
# 안전:
# - workflow_dispatch 전용 (push/PR 로는 절대 트리거되지 않음)
# - 스크립트는 SELECT 뿐 — 쓰기 옵션 자체가 없다(--apply 없음). 끝에 rollback().
# - 셀렉터의 네 가드와 활성 블록·KST 규칙은 테스트로 고정됨
#   (tests/test_preview_card_target_date_backfill.py)
#
# ⚠️ 이 워크플로는 $APP_DIR(= deploy.yml 이 rsync 한 최신 main)에서 실행된다. 스크립트가
# 머지·배포되기 전에 dispatch 하면 옛 코드가 조용히 돈다 — 아래 Verify 스텝이 커밋을 찍는다.

on:
  workflow_dispatch: {}

concurrency:
  # deploy 와 같은 앱 디렉터리를 쓰므로 배포와 겹치지 않게 직렬화.
  # queue: max — 기본(single)은 pending 취소로 대기 중 deploy 가 유실된다 (deploy.yml 참조).
  group: deploy-ec2
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    name: "preview (read-only)"
    runs-on: [self-hosted, ec2, reaction-backend]
    timeout-minutes: 10

    env:
      APP_DIR: /home/ubuntu/reaction-backend

    steps:
      - name: Verify deployed commit
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "APP_DIR HEAD: $(git rev-parse --short HEAD 2>/dev/null || echo '(git 아님)')"
          test -f scripts/preview_card_target_date_backfill.py \
            || { echo "::error::스크립트가 배포되지 않았다 — 머지·배포 후 다시 실행할 것"; exit 1; }

      - name: Run preview
        working-directory: ${{ env.APP_DIR }}
        run: |
          ~/.local/bin/uv run --no-dev python -m scripts.preview_card_target_date_backfill \
            | tee /tmp/preview-card-backfill.out

      - name: Summary
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "### Preview: card target_date backfill (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 /tmp/preview-card-backfill.out >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
