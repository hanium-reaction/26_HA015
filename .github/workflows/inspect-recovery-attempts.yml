name: Inspect recovery attempts (EC2, read-only)

# 회복 카드를 1장 단위로 들여다본다 — 도그푸딩(#258) 점검용.
# 집계 리포트(report-recovery-followthrough)가 "완주 0건"이라고만 말하는 것의 **왜**를
# 본다: 어떤 전략·태그가 뽑혔는지, 나머지 카드가 거절/건너뜀/미결정 중 무엇인지,
# 회복 블록이 과거에 놓여 알림을 못 받는 상태인지.
#
# 안전:
# - workflow_dispatch 전용 (push/PR 로는 절대 트리거되지 않음)
# - 스크립트는 SELECT 뿐 — 쓰기 옵션 자체가 없다. 끝에 rollback().
# - 카드 문구는 앞 60자만 출력한다 (사용자 콘텐츠가 Actions 로그에 전문으로 안 남게).
# - 판정(과거 배치·신설 전략 도달·문구 절단)은 테스트로 고정됨
#   (tests/test_inspect_recovery_attempts.py)
#
# ⚠️ 이 워크플로는 $APP_DIR(= deploy.yml 이 rsync 한 최신 main)에서 실행된다. 스크립트가
# 머지·배포되기 전에 dispatch 하면 옛 코드가 조용히 돈다 — 아래 Verify 스텝이 막는다.

on:
  workflow_dispatch: {}

concurrency:
  # deploy 와 같은 앱 디렉터리를 쓰므로 배포와 겹치지 않게 직렬화.
  group: deploy-ec2
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    name: "inspect (read-only)"
    runs-on: [self-hosted, ec2, reaction-backend]
    timeout-minutes: 10

    env:
      APP_DIR: /home/ubuntu/reaction-backend

    steps:
      - name: Verify deployed script
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f scripts/inspect_recovery_attempts.py \
            || { echo "::error::스크립트가 배포되지 않았다 — 머지·배포 후 다시 실행할 것"; exit 1; }

      - name: Run inspection
        working-directory: ${{ env.APP_DIR }}
        run: |
          ~/.local/bin/uv run --no-dev python -m scripts.inspect_recovery_attempts \
            | tee /tmp/inspect-recovery-attempts.out

      - name: Summary
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "### Recovery attempts — per-card detail (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/inspect-recovery-attempts.out >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
